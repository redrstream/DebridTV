name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Recreate the signing key on the runner from encrypted repo secrets.
      # The keystore + passwords are never committed; they live only in GitHub Secrets.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTOREBASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.STOREPASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Read version name
        id: ver
        run: echo "vn=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*\"\(.*\)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DebridTV-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebridTV-release-apk
          path: DebridTV-release.apk
          if-no-files-found: error

      # Publish the signed APK to GitHub Releases so the TV can download it (and,
      # later, an in-app updater can check for a newer version). Tagged by version
      # name; re-running the same version updates that release in place.
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}
          name: DebridTV v${{ steps.ver.outputs.vn }}
          files: DebridTV-release.apk
          make_latest: true
